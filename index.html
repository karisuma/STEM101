<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="STEM101 프로젝트 목록">
    <title>STEM101 | 프로젝트</title>
    <link rel="stylesheet" href="assets/portal.css">
    <script type="module" src="assets/portal.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#project-list">프로젝트 목록으로 건너뛰기</a>

    <header class="site-header">
      <a class="brand" href="./" aria-label="STEM101 홈">STEM<span>101</span></a>
      <a
        class="repository-link"
        href="https://github.com/karisuma/STEM101"
        target="_blank"
        rel="noreferrer"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M12 .8a11.4 11.4 0 0 0-3.6 22.2c.6.1.8-.3.8-.6v-2.2c-3.4.7-4.1-1.4-4.1-1.4-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.7 0-1.3.4-2.3 1.2-3.1-.1-.3-.5-1.6.1-3.1 0 0 1-.3 3.1 1.2a10.6 10.6 0 0 1 5.7 0C15.8 4 16.8 4.3 16.8 4.3c.6 1.5.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.8 5.4-5.5 5.7.4.4.8 1.1.8 2.2v4c0 .3.2.7.8.6A11.4 11.4 0 0 0 12 .8Z"/>
        </svg>
        GitHub 저장소
      </a>
    </header>

    <main>
      <h1>프로젝트</h1>

      <section class="statistics" aria-label="프로젝트 통계">
        <article>
          <span>전체 프로젝트</span>
          <strong id="stat-total">0</strong>
        </article>
        <article>
          <span>완료</span>
          <strong id="stat-complete">0</strong>
        </article>
        <article>
          <span>제작 중</span>
          <strong id="stat-progress">0</strong>
        </article>
        <article>
          <span>과목</span>
          <strong id="stat-subjects">0</strong>
        </article>
      </section>

      <section class="controls" aria-label="프로젝트 검색과 필터">
        <label class="search-control">
          <span class="visually-hidden">프로젝트 이름 검색</span>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <path d="m15.5 15.5 5 5"></path>
          </svg>
          <input id="project-search" type="search" placeholder="프로젝트 이름 검색">
        </label>

        <fieldset data-filter-group="level">
          <legend>학년</legend>
          <div>
            <button class="selected" type="button" data-value="all" aria-pressed="true">전체</button>
            <button type="button" data-value="elementary" aria-pressed="false">초등</button>
            <button type="button" data-value="middle" aria-pressed="false">중등</button>
          </div>
        </fieldset>

        <fieldset data-filter-group="subject">
          <legend>과목</legend>
          <div>
            <button class="selected" type="button" data-value="all" aria-pressed="true">전체</button>
            <button type="button" data-value="math" aria-pressed="false">수학</button>
            <button type="button" data-value="science" aria-pressed="false">과학</button>
          </div>
        </fieldset>

        <fieldset data-filter-group="status">
          <legend>상태</legend>
          <div>
            <button class="selected" type="button" data-value="all" aria-pressed="true">전체</button>
            <button type="button" data-value="complete" aria-pressed="false">완료</button>
            <button type="button" data-value="in-progress" aria-pressed="false">제작 중</button>
          </div>
        </fieldset>
      </section>

      <section class="project-section" aria-labelledby="project-list-title">
        <div class="list-heading">
          <h2 id="project-list-title">프로젝트 목록</h2>
          <span id="result-count" aria-live="polite"></span>
        </div>

        <div class="project-table" id="project-list">
          <div class="table-header" aria-hidden="true">
            <span>프로젝트</span>
            <span>학년</span>
            <span>과목</span>
            <span>상태</span>
            <span>기술</span>
            <span>열기</span>
          </div>
          <div id="project-rows">
            <p class="message">프로젝트 목록을 불러오고 있습니다.</p>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <a href="https://github.com/karisuma/STEM101" target="_blank" rel="noreferrer">
        GitHub 저장소
      </a>
    </footer>

    <template id="project-template">
      <article class="project-row">
        <div class="project-name" data-label="프로젝트">
          <strong></strong>
          <small></small>
        </div>
        <span class="grade" data-label="학년"></span>
        <span class="subject" data-label="과목"></span>
        <span class="status" data-label="상태"></span>
        <span class="technology" data-label="기술"></span>
        <a class="open-project" data-label="열기">
          열기
          <svg aria-hidden="true" viewBox="0 0 20 20">
            <path d="M7 4h9v9M16 4 6 14"></path>
          </svg>
        </a>
      </article>
    </template>
  </body>
</html>
