<script type="module">import * as T from"three";import{OrbitControls}from"three/addons/controls/OrbitControls.js";const S=document.querySelector("#stage"),sc=new T.Scene(),cam=new T.PerspectiveCamera(42,1,.1,500);cam.position.set(0,8,19);const r=new T.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));S.prepend(r.domElement);const ctl=new OrbitControls(cam,r.domElement);ctl.enableDamping=true;ctl.minDistance=10;ctl.maxDistance=28;sc.add(new T.AmbientLight(0xc5dbe3,1.8),new T.HemisphereLight(0xc7edff,0x58636b,2));const earth=new T.Mesh(new T.SphereGeometry(3,64,32),new T.MeshStandardMaterial({color:0x347fac,roughness:.75,emissive:0x234757,emissiveIntensity:.65}));sc.add(earth);const water=new T.Mesh(new T.SphereGeometry(3.12,64,32),new T.MeshPhysicalMaterial({color:0x32c4dd,transparent:true,opacity:.24,roughness:.2}));sc.add(water);const sun=new T.Mesh(new T.SphereGeometry(1.1,32,16),new T.MeshBasicMaterial({color:0xffd45f})),moon=new T.Mesh(new T.SphereGeometry(.5,32,16),new T.MeshStandardMaterial({color:0xe3e7e8,emissive:0x4a5053,emissiveIntensity:.5}));sc.add(sun,moon);const light=new T.DirectionalLight(0xffdf9b,3.5);sc.add(light);function ring(n,c){let p=[];for(let i=0;i<129;i++){let a=i/128*6.283;p.push(new T.Vector3(Math.cos(a)*n,0,Math.sin(a)*n))}let q=new T.Line(new T.BufferGeometry().setFromPoints(p),new T.LineBasicMaterial({color:c,transparent:true,opacity:.35}));q.rotation.x=.16;sc.add(q)}ring(6.1,0xa5cbd5);ring(10.5,0xffd45f);const av=new T.Group(),hd=new T.Mesh(new T.SphereGeometry(.16,12,8),new T.MeshBasicMaterial({color:0xff684f})),bd=new T.Mesh(new T.ConeGeometry(.18,.55,12),hd.material);bd.position.y=-.33;av.add(hd,bd);sc.add(av);let time=5.75,run=true,mo=0,so=0,lat=33.4996,lon=126.5312,drag=null,last=performance.now(),placing=true;function ang(){return[time/24*12.566+mo,time/24*6.283+so]}function pos(){let a=ang();moon.position.set(Math.cos(a[0])*6.1,Math.sin(a[0]*.5),Math.sin(a[0])*6.1);sun.position.set(Math.cos(a[1])*10.5,Math.sin(a[1]*.3)*1.4,Math.sin(a[1])*10.5);light.position.copy(sun.position);earth.rotation.y=-time/24*6.283;let p=T.MathUtils.degToRad(90-lat),q=T.MathUtils.degToRad(lon);av.position.set(3.35*Math.sin(p)*Math.cos(q),3.35*Math.cos(p),-3.35*Math.sin(p)*Math.sin(q));av.lookAt(av.position.clone().multiplyScalar(2))}function tide(h){let a=h/24*12.566+mo,b=h/24*6.283+so;return .5+.27*(mp.value/100)*Math.cos(a-lon/180*Math.PI)+.13*(sp.value/46)*Math.cos(b-lon/180*Math.PI)}const cx=chart.getContext("2d");function draw(){let d=devicePixelRatio||1,w=chart.clientWidth,h=chart.clientHeight;chart.width=w*d;chart.height=h*d;cx.setTransform(d,0,0,d,0,0);cx.clearRect(0,0,w,h);cx.strokeStyle="#4fe0ec";cx.lineWidth=2;cx.beginPath();for(let i=0;i<=120;i++){let x=i/120*w,y=h-tide(i/5)*h/1.05;i?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke();let x=time/24*w,y=h-tide(time)*h/1.05;cx.fillStyle="#ff7059";cx.beginPath();cx.arc(x,y,5,0,6.283);cx.fill()}function update(){let v=Math.max(0,Math.min(1,tide(time))),a=ang();clock.textContent=String(time|0).padStart(2,"0")+":"+String((time%1*60)|0).padStart(2,"0");level.textContent="수위 "+Math.round(v*100)+"%";fill.style.width=v*100+"%";trend.textContent=v>tide(time-.08)?"상승 중":"하강 중";cause.textContent=Math.abs(Math.cos(a[0]-a[1]))>.72?"달과 태양의 조석력이 강화됩니다.":"달과 태양의 조석력이 일부 상쇄됩니다.";day.textContent=(Math.cos(a[1]+lon/180*Math.PI)>-.1?"낮":"밤")+" · "+lat.toFixed(2)+"°N, "+lon.toFixed(2)+"°E";draw()}const ray=new T.Raycaster(),mouse=new T.Vector2();function point(e){let b=r.domElement.getBoundingClientRect();mouse.set((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1);ray.setFromCamera(mouse,cam)}r.domElement.onpointerdown=e=>{point(e);let h=ray.intersectObjects([sun,moon,earth])[0];if(h&&[sun,moon].includes(h.object)){drag=h.object;ctl.enabled=false}else if(placing&&h?.object===earth){let p=earth.worldToLocal(h.point.clone()).normalize();lat=90-T.MathUtils.radToDeg(Math.acos(p.y));lon=T.MathUtils.radToDeg(Math.atan2(-p.z,p.x));update()}};r.domElement.onpointermove=e=>{if(!drag)return;point(e);let p=new T.Vector3();ray.ray.intersectPlane(new T.Plane(new T.Vector3(0,1,0),0),p);let a=Math.atan2(p.z,p.x),base=drag===moon?time/24*12.566:time/24*6.283;if(drag===moon)mo=a-base;else so=a-base;pos();update()};addEventListener("pointerup",()=>{drag=null;ctl.enabled=true});play.onclick=()=>{run=!run;play.textContent=run?"Ⅱ 일시정지":"▶ 재생"};place.onclick=()=>{placing=!placing;place.classList.toggle("on",placing)};settings.onclick=()=>panel.classList.toggle("open");plus.onclick=()=>{time=(time+1)%24;update()};minus.onclick=()=>{time=(time+23)%24;update()};mp.oninput=()=>{mv.textContent=mp.value+"%";update()};sp.oninput=()=>{sv.textContent=sp.value+"%";update()};today.onclick=()=>{let d=new Date(),n=d/864e5+2440587.5-2451545,L=(280.46+.9856474*n)%360,g=(357.528+.9856003*n)%360,s=L+1.915*Math.sin(g*Math.PI/180),m=(218.316+13.176396*n+6.289*Math.sin(((134.963+13.064993*n)%360)*Math.PI/180))%360;time=d.getHours()+d.getMinutes()/60;so=s*Math.PI/180-time/24*6.283;mo=m*Math.PI/180-time/24*12.566;lat=33.4996;lon=126.5312;run=false;play.textContent="▶ 재생";pos();update()};function resize(){let w=S.clientWidth,h=S.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();draw()}addEventListener("resize",resize);resize();pos();update();function loop(n){if(run){time=(time+(n-last)/1e3*.12)%24;pos();update()}last=n;ctl.update();r.render(sc,cam);requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
