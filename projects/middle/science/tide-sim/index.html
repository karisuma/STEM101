<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="지구·달·태양의 위치를 움직이며 조석의 원리를 탐구하는 중학생용 과학 시뮬레이션">
  <title>조석 시뮬레이터 만들기 | STEM101</title>
  <link rel="stylesheet" href="styles/tide-sim.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"}}</script>
</head>
<body>
<a class="back-link" href="../../../../">← STEM101 프로젝트</a>
<main class="app"><section class="stage" id="stage"><img class="logo" src="assets/coding101-logo.png" alt="Coding101"><div class="tools"><button id="play">Ⅱ 일시정지</button><button id="today">오늘의 해·달·제주</button><button id="place" class="on">내 위치 지정</button><button id="settings">실험 설정</button></div><div class="panel" id="panel"><b>조석 영향력</b><label>달 <span id="mv">100%</span></label><input id="mp" type="range" min="0" max="180" value="100"><label>태양 <span id="sv">46%</span></label><input id="sp" type="range" min="0" max="100" value="46"><p style="font-size:12px;color:#9fc1c9">해와 달을 각 궤도에서 따로 드래그하고 지구를 클릭해 관측자를 옮기세요.</p></div><div class="hint">지구 클릭: 관측 위치 · 해/달 드래그: 궤도 이동 · 빈 공간 드래그: 시점 회전</div><div class="card"><small id="trend">상승 중</small><br><b id="level">수위 72%</b><div class="bar"><i id="fill"></i></div><small id="cause"></small></div></section><section class="bottom"><div class="status"><small>제주 관측 지점 · 하루 시뮬레이션</small><b id="clock">05:45</b><small id="day">낮 · 33.50°N, 126.53°E</small><div style="margin-top:8px"><button id="minus">−1시간</button> <button id="plus">+1시간</button></div></div><div class="chart"><h3>24시간 예상 수위 변화</h3><canvas id="chart"></canvas></div></section></main>

  <script type="module" src="scripts/tide-sim.js"></script>
</body>
</html>
